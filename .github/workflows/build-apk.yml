name: Build Android APK (Ravio)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      backend_url:
        description: "آدرس سرور مستقرشده (اختیاری - مثال: https://your-app.run.app)"
        required: false
        default: ""

jobs:
  build-apk:
    name: Build Ravio Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install Capacitor Android packages
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets (Vite)
        env:
          VITE_BACKEND_URL: ${{ github.event.inputs.backend_url || vars.VITE_BACKEND_URL || '' }}
        run: npm run build

      - name: Add and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Ravio app icons to Android mipmaps
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              if [ -f "$dir/ic_launcher.png" ]; then cp public/pwa-512x512.png "$dir/ic_launcher.png"; fi
              if [ -f "$dir/ic_launcher_round.png" ]; then cp public/pwa-512x512.png "$dir/ic_launcher_round.png"; fi
              if [ -f "$dir/ic_launcher_foreground.png" ]; then cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"; fi
            fi
          done

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravio-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
